name: tests
# Public repo: Actions minutes are free here (agent-rules rule 8 limits private repos only).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift:
    # macOS runners never picked this job up (cancelled after 15 min queued, 0 steps, every run 2026-11-09), so it
    # runs by hand before a release (`gh workflow run tests --ref main`); `swift test` runs locally on the Mac anyway.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test
      - run: sh scripts/testflight.test.sh
  linux:
    runs-on: ubuntu-latest
    container: swift:6.1
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
